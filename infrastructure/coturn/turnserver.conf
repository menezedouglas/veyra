# Veyra — referência de operação. Não é endpoint público operacional.
# Complementar em /run (tmpfs) com realm, cert, pkey e static-auth-secret
# provenientes da configuração protegida do operador.
listening-port=3478
relay-threads=2
tls-listening-port=5349
min-port=49160
max-port=49259
fingerprint
use-auth-secret
stale-nonce=600
max-allocate-lifetime=600
user-quota=4
total-quota=256
max-bps=131072
bps-capacity=16777216
unauthorized-ratelimit
unauthorized-ratelimit-rps=20
no-multicast-peers
no-tcp-relay
# DTLS do cliente TURN não é necessário. DTLS WebRTC entre peers permanece ativo.
# Sem banco de usuários. Credenciais TURN REST verificadas em RAM.
pidfile=/run/veyra-turn/turnserver.pid
no-stdout-log
log-file=/dev/null
simple-log
# Bloquear destinos internos/metadados e multicast; ajustar apenas em laboratório.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No database driver is selected; do not add userdb, even /dev/null.
no-dynamic-ip-list
no-dynamic-realms
