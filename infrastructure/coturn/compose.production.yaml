name: veyra-relay
services:
  relay:
    image: coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    entrypoint: ["/bin/sh", "/etc/veyra/entrypoint.sh"]
    volumes:
      - ./turnserver.conf:/etc/veyra/turnserver.conf:ro
      - ./entrypoint.sh:/etc/veyra/entrypoint.sh:ro
      - ${VEYRA_TURN_OPERATOR_CONFIG:?Set a protected operator config path}:/run/secrets/turn-operator.conf:ro
      - ${VEYRA_TURN_TLS_DIRECTORY:?Set the operator TLS directory}:/run/veyra-tls:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "443:5349/tcp"
      - "49160-49259:49160-49259/udp"
    read_only: true
    tmpfs:
      - /run/veyra-turn:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=4m
      - /var/lib/coturn:rw,noexec,nosuid,size=4m
    logging: {driver: none}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
