# EXCLUSIVAMENTE laboratório isolado, sem portas publicadas na Internet.
# Credenciais públicas sintéticas de teste; nunca reutilizar em produção.
listening-port=3478
relay-threads=2
min-port=49160
max-port=49191
realm=veyra-laboratory
lt-cred-mech
user=synthetic:synthetic-laboratory-only
fingerprint
no-tls
no-tcp-relay
no-multicast-peers
user-quota=16
total-quota=32
max-bps=131072
bps-capacity=1048576
max-allocate-lifetime=600
pidfile=/tmp/veyra-turnserver.pid
no-stdout-log
log-file=/dev/null
simple-log

# No database driver is selected; do not add userdb, even /dev/null.
no-dynamic-ip-list
no-dynamic-realms
