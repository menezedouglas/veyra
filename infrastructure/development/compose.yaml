name: veyra-infra
services:
  coturn-laboratory: &coturn-laboratory
    image: coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    command: ["-c", "/etc/veyra/laboratory.conf"]
    volumes:
      - ../coturn/laboratory.conf:/etc/veyra/laboratory.conf:ro
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=4m
      - /var/lib/coturn:rw,noexec,nosuid,size=4m
    logging:
      driver: none
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    networks: [laboratory]
    # No published ports. Run synthetic peers on this network.
  coturn-rest-laboratory:
    <<: *coturn-laboratory
    command: ["-c", "/etc/veyra/laboratory-rest.conf"]
    volumes:
      - ../coturn/laboratory-rest.conf:/etc/veyra/laboratory-rest.conf:ro
networks:
  laboratory:
    driver: bridge
