name: Verify Veyra
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-2025' && '1.99.1-x86_64-pc-windows-msvc' || '1.99.1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev
      - name: Fixed Rust toolchain
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
      - name: Install pnpm with its required bootstrap script
        run: npm install --global pnpm@12.18.0 --allow-scripts=pnpm
      - name: Verify pnpm executable
        run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test tests/scripts/*.test.mjs
      - name: Release gate and assembly regression tests
        run: python -m unittest discover -s tests/scripts -p "test_*.py"
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Core and real vault-process tests on Linux
        if: runner.os == 'Linux'
        run: cargo test --locked
      - name: Core and real private named-pipe process tests on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked
      - name: Windows real WSS and bidirectional product session
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: python tests/integration/run_product_windows.py --report target/windows-product-report.json
      - run: cargo check --locked -p veyra-desktop
      - run: python tests/persistence/check_source.py
      - run: python tests/security/check_capabilities.py
      - run: python tests/security/glib_backport.py
      - run: pnpm audit --audit-level low
      - name: Preserve Windows product-session evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-product-evidence
          path: target/windows-product-report.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Selected-pair FFI regression against actual vendored source
        run: python3 tests/security/datachannel_padding.py --prove-original-failure
      - run: cargo build --locked -p veyra-tests
      - name: Real direct peers (local lab, no human identity claim)
        timeout-minutes: 10
        run: python3 tests/integration/run.py --binary target/debug/veyra-tests
      - name: TURN UDP lab with Rust backend
        timeout-minutes: 10
        run: python3 scripts/connectivity-lab.py
      - name: Native backend prerequisites
        run: sudo apt-get update && sudo apt-get install -y libnice-dev libclang-dev cmake pkg-config libssl-dev
      - name: Build existing libdatachannel/libnice backend
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/infrastructure/development/libdatachannel-nice.cmake
        run: cargo build --locked -p veyra-tests --features veyra-transport/native-libnice
      - name: TURN UDP / TCP / TLS with certificate validation
        timeout-minutes: 10
        shell: bash
        run: |
          veyra_native_lib_dir=$(find target/debug/build -path '*/out/lib/libdatachannel.so' -printf '%h' -quit)
          test -n "$veyra_native_lib_dir"
          export LD_LIBRARY_PATH="$PWD/$veyra_native_lib_dir"
          python3 scripts/connectivity-lab.py --native
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo install cargo-audit --version 0.22.0 --locked
      - run: cargo audit
      - run: python3 tests/security/glib_backport.py
