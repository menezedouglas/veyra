[package]
name = "veyra-ipc"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
getrandom = "=0.2.16"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
veyra-protocol = { path = "../protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.54.1", features = ["net"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "io-util"] }
