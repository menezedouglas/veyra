[package]
name = "veyra-transport"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[features]
native-libnice = ["dep:datachannel", "dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:url"]

[dependencies]
veyra-connectivity = { path = "../connectivity" }
webrtc = "=0.21.1"
rtc = { version = "=0.21.1", default-features = false }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
async-trait = "=0.1.92"
bytes = "=1.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
datachannel = { version = "=0.16.1", default-features = false, features = ["log"], optional = true }
log = { version = "=0.4.35", features = ["max_level_off", "release_max_level_off"] }
tokio-rustls = { version = "=0.26.6", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "=0.8.5", optional = true }
url = { version = "=2.5.8", optional = true }

[dev-dependencies]
rcgen = "=0.14.10"
